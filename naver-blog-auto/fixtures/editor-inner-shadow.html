<!doctype html>
<meta charset="utf-8">
<title>본문이 shadow DOM 안에 있는 에디터</title>
<!--
  사용자 화면에서 실제로 일어난 일을 흉내 낸다:
  커서는 분명히 본문에 내려와 있는데, document.activeElement 로 보면 본문이 아니라고 나온다.
  (shadow DOM 을 쓰면 바깥 문서의 activeElement 가 "껍데기 요소"로 잡혀서 정확히 이 상황이 된다)
  → 화면 상태를 읽는 판정은 실패하고, 실제로 쳐보는 판정만 통과해야 한다.
-->
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#fff}
  .se-canvas{padding:16px 24px 60px}
  .se-section-documentTitle{border-bottom:1px solid #eee;padding:8px 0;margin-bottom:12px}
  .se-section-documentTitle .se-text-paragraph{font-size:22px;font-weight:700;min-height:32px;outline:none}
  .se-content{min-height:420px}
</style>

<div class="se-canvas">
  <div class="se-section-documentTitle">
    <div class="se-text-paragraph" contenteditable="true" id="titleEl"></div>
  </div>
  <div class="se-content" id="content"></div>
</div>

<script>
// 본문을 shadow DOM 안에 만든다.
const host = document.getElementById("content");
const root = host.attachShadow({ mode: "open" });
const style = document.createElement("style");
style.textContent = `
  .se-component{margin:6px 0}
  .se-text-paragraph{min-height:22px;outline:none;line-height:1.7}
`;
root.appendChild(style);

let current = null;
function newParagraph() {
  const comp = document.createElement("div");
  comp.className = "se-component se-text";
  const section = document.createElement("div");
  section.className = "se-section se-section-text";
  const module = document.createElement("div");
  module.className = "se-module se-module-text";
  const p = document.createElement("div");
  p.className = "se-text-paragraph";
  p.contentEditable = "true";
  module.appendChild(p); section.appendChild(module); comp.appendChild(section);
  root.appendChild(comp);
  current = p;
  return p;
}
newParagraph();

// 본문 빈 곳 클릭 → 새 문단
host.addEventListener("click", (e) => {
  if (e.composedPath().some((n) => n.classList && n.classList.contains("se-component"))) return;
  newParagraph().focus();
});

// Enter 로 새 문단 (제목에서는 안 됨 — 7-26 재현)
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (document.activeElement === document.getElementById("titleEl")) { e.preventDefault(); return; }
  e.preventDefault();
  newParagraph().focus();
});

// 검사용: 본문 텍스트를 바깥에서 읽을 수 있게 열어둔다
window.__bodyTexts = () => [...root.querySelectorAll(".se-component")].map((c) => c.textContent.trim());
</script>
