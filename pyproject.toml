[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelforge"
version = "0.1.0"
description = "촬영본 + 기획 브리프 → 컷편집·자막·AI오디오가 얹힌 캡컷 프로젝트"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 음성 인식 (컷편집·자막의 전제)
stt = ["faster-whisper>=1.0.0"]
# 무료 AI 목소리
tts = ["edge-tts>=6.1.0"]
dev = ["pytest>=8.0"]
all = ["faster-whisper>=1.0.0", "edge-tts>=6.1.0"]

[project.scripts]
reelforge = "reelforge.cli:main"

[tool.setuptools.packages.find]
include = ["reelforge*"]

[tool.setuptools.package-data]
reelforge = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
