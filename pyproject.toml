[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reelforge"
version = "0.1.0"
description = "쇼핑쇼츠 자동 제작 — 기획(shortsforge) + 컷편집·자막·AI오디오(reelforge)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0",
    # 캡컷 draft 생성. 스키마가 버전마다 바뀌는 걸 대신 추적해준다.
    "pycapcut>=0.0.3",
]

[project.optional-dependencies]
# 음성 인식 (컷편집·자막의 전제)
stt = ["faster-whisper>=1.0.0"]
# 무료 AI 목소리
tts = ["edge-tts>=6.1.0"]
dev = ["pytest>=8.0"]
all = ["faster-whisper>=1.0.0", "edge-tts>=6.1.0"]
# pycapcut 은 필수 의존성이라 여기 없다 (pip install reelforge 로 같이 깔림)

[project.scripts]
reelforge = "reelforge.cli:main"
shortsforge = "shortsforge.cli:main"

[tool.setuptools.packages.find]
include = ["reelforge*", "shortsforge*"]

[tool.setuptools.package-data]
reelforge = ["templates/*.yaml"]
shortsforge = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
