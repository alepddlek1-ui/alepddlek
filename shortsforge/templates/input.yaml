# 쇼핑쇼츠 한 편의 입력.
# shortsforge ingest 가 아는 만큼 채워두고, 나머지는 비어 있어도 굴러간다.
name: "__NAME__"
created: "__DATE__"

# ── 소재 ────────────────────────────────────────────────────
source:
  video: "__VIDEO__"          # 원본 영상 경로 (복사하지 않는다. 용량 때문에)
  duration_sec: __DURATION__  # ffprobe 가 읽은 길이
  size: "__SIZE__"            # 예: 1080x1920
  images: []                  # 제품 사진 경로들. 상품 분석·키워드가 읽는다
  reference: []               # 레퍼런스 영상 링크 또는 대본 파일. 경쟁 분석이 읽는다
  note: ""                    # "제품 클로즈업 12초쯤" 같은 촬영 메모

# ── 상품 ────────────────────────────────────────────────────
product:
  name: ""                    # 비우면 작업 폴더 이름을 쓴다
  url: "__URL__"              # 상품 상세 페이지 (쿠팡/네이버/자사몰)
  category: "__CATEGORY__"    # 생활용품 · 살림템 · 테크 · 주방 · 차량 · 계절
  price: ""
  affiliate: ""               # 캡션에 넣을 구매 링크

# ── 누구에게 파는가 ─────────────────────────────────────────
# 비워두면 채널 기본값(35세 육아맘, 털털하고 쾌활)을 그대로 쓴다.
audience:
  who: ""                     # 예: 20~30대 자취생
  pain: ""                    # 예: 설거지가 귀찮다
  tone: ""

video:
  duration_sec: 20            # 목표 길이. 대본 프롬프트가 20초 기준이다
  aspect: "9:16"
  narration: true             # AI 목소리 사용 여부
  voice: "ko-KR-SunHiNeural"

rules:
  # 지키면 채널이 오래 가고, 어기면 한 번에 날아가는 것들
  - "절대 과장 금지 — 체험하지 않은 효과를 단정하지 않는다"
  - "의료·효능 표현 금지 (완치, 치료, 부작용 없음)"
  - "최저가·1위 같은 표현은 근거가 있을 때만"
  - "유료 광고면 캡션 첫 줄에 표기한다"
