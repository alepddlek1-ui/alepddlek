# ─────────────────────────────────────────────────────────────
#  쇼핑 쇼츠 20초 — reelforge 브리프
#  대본 담당이 채워서 내보낸다. 이 파일 그대로 `reelforge build`
# ─────────────────────────────────────────────────────────────
project: __날짜___제품명       # 예: 2026-09-차량용청소기

footage:
  - raw/__촬영본__.mp4         # 촬영 파일 경로만 사람이 채운다

aspect: "9:16"
fps: 30

# ── 기획 ────────────────────────────────────────────────────
hook: "__15자 이내 훅__"        # 0~1초에 크게 박히는 첫 문장
idea: |
  타깃: __누구__
  각: __어떤 짜증을 몇 초 만에__
  카테고리: 생활용품 | 살림템 | 테크 | 주방용품 | 차량용품 | 계절상품
  구조: 훅 → 공감/문제 → 해결 → 제품 → CTA(구독+제품태그+댓글질문)
  증인: __남편 | 친정엄마 | 여동생 | 오빠 | 이모 | 삼촌 | 아기__
  확인 필요: __지어내지 않고 비워둔 스펙__
cta: "아래 제품 눌러보세요"

# script: 한 줄 = 한 호흡 (12~16자). 총 7~9줄 · 공백 제외 90~105자 = 20초
# 숫자·영어는 읽는 대로 한글로. 괄호·이모지·말줄임표 쓰지 않는다.
script: |
  __훅 한 줄__
  __문제 두 줄__
  __해결 두 줄__
  __제품 근거 + 숫자 두 줄__
  __증인 또는 오픈 루프 한 줄__
  구독 눌러주시고 아래 제품 확인해보세요
  __댓글 유도 질문 한 줄__

# 자막에서 강조할 단어 (결정을 미는 것만 3~5개)
keywords:
  - __가격__
  - __시간__

# ── 자막 ────────────────────────────────────────────────────
captions:
  source: script        # 나레이션 대본 기준. 직접 말한 영상이면 transcript
  style: reels_bold
  max_chars: 14
  max_lines: 2
  min_duration: 0.7
  max_duration: 2.2     # 20초짜리는 한 장을 길게 두지 않는다
  position: 0.72
  overlay_position: 0.32

# ── AI 오디오 ───────────────────────────────────────────────
narration:
  enabled: true
  provider: edge
  voice: ko-KR-SunHiNeural
  speed: 1.08           # 쇼츠는 살짝 빠르게. 1.15 넘으면 말이 뭉친다
  mode: replace         # 대본 목소리만 쓸 때. 내 목소리를 깔면 mix
  align: clips          # 각 문장을 컷 시작점에 맞춘다
  gap: 0.12             # 20초 안에 9줄을 넣으려면 숨을 짧게

# music: assets/bgm.mp3
music_gain_db: -18.0

# ── 컷 강도 ─────────────────────────────────────────────────
cut:
  max_pause: 0.32       # 20초짜리는 정적을 더 짧게
  min_clip: 0.30
  trim_head_tail: true
  drop_retakes: true

filler:
  dead_air: 0.45
  soft_pause: 0.28

# 절대 자르면 안 되는 구간 (원본 기준 초) — 제품 클로즈업 등
# protect:
#   - [3.0, 5.5]

stt_model: small        # 자막을 script 로 뽑으면 전사는 가벼워도 된다
language: ko
